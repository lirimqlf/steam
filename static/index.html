<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideQuest · Dead game scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080D1C;--panel:#0F1730;--raise:#16213F;--line:rgba(160,185,255,.10);--text:#F2F6FF;--mut:#8D9AB9;--blue:#2F6BFF;--blue2:#6C97FF;--amber:#F2B84B;--r:12px;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum","cv11";-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(8,13,28,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{color:var(--mut);font-size:12.5px}
.pill{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px;padding:0 6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);transition:background .3s,box-shadow .3s}
.dot.on{background:#7FB0FF;box-shadow:0 0 0 4px rgba(108,151,255,.16)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-weight:550;transition:background .2s,transform .15s var(--ease),box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{color:var(--text);background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--raise)}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 18px -6px rgba(47,107,255,.7)}
.btn.pri:hover{background:#4378FF}
.btn.stop{background:#fff;color:#0A1330}
#bar{height:2px;background:transparent;position:relative;overflow:hidden}
#bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .5s var(--ease)}
#bar.run i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sweep 1.3s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 8px}
.stat{padding:2px 28px;border-left:1px solid var(--line)}
.stat:first-child{padding-left:0;border:0}
.stat strong{display:block;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat.hero strong{color:var(--blue2)}
.stat span{color:var(--mut);font-size:13px}
.scan{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.scan.on{grid-template-rows:1fr}
.scan>div{overflow:hidden}
.scan p{margin:12px 0 0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan p b{color:var(--text);font-weight:550}
/* toolbar */
.tb{display:flex;align-items:center;gap:14px;margin:26px 0 14px;flex-wrap:wrap}
.seg{position:relative;display:flex;padding:3px;background:var(--panel);border-radius:11px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{position:relative;z-index:1;padding:6px 16px;border-radius:8px;color:var(--mut);font-weight:550;transition:color .25s}
.seg button.on{color:#fff}
.thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--blue);transition:transform .4s var(--ease),width .4s var(--ease)}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search .ic{position:absolute;left:12px;top:9px;color:var(--mut)}
.search input{width:100%;height:36px;padding:0 12px 0 38px;border-radius:10px;border:0;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);outline:0;transition:box-shadow .2s}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--blue2)}
.sw{display:inline-flex;align-items:center;gap:10px;color:var(--mut);cursor:pointer;user-select:none}
.sw input{display:none}
.sw i{width:34px;height:20px;border-radius:20px;background:var(--raise);position:relative;transition:background .25s;flex:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.sw input:checked+i{background:var(--blue)}
.sw input:checked+i::after{transform:translateX(14px)}
.sw input:checked~em{color:var(--text)}
.sw em{font-style:normal}
#count{margin-left:auto;color:var(--mut);font-size:13px}
/* table */
.tbl{background:var(--panel);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12.5px;padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(108,151,255,.05)}
.num{text-align:right}th.num{text-align:right}
.game{display:flex;align-items:center;gap:12px;min-width:0}
.gi{width:36px;height:36px;border-radius:9px;background:var(--raise);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--mut);font-weight:600}
.gn{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.gs{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.zero{color:var(--mut)}
.ring{width:38px;height:38px;display:block}
.ring circle{fill:none;stroke-width:3.2;stroke-linecap:round}
.ring .rt{stroke:var(--raise)}
.ring .rv{transition:stroke-dashoffset 1s var(--ease) .1s}
.ring text{fill:var(--text);font-size:11.5px;font-weight:600;text-anchor:middle}
.ci{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--blue2);transition:background .2s}
.ci:hover{background:var(--raise)}
.bd{display:inline-flex;align-items:center;gap:7px;font-weight:550}
.bd::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}
.bd.dead::before{background:var(--blue2)}.bd.dying::before{background:var(--amber)}
.bd.dead{color:var(--blue2)}.bd.dying{color:var(--amber)}.bd.alive,.bd.unknown{color:var(--mut)}
.act{display:flex;gap:6px;justify-content:flex-end}
.lk{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:8px;color:var(--mut);font-size:13px;font-weight:500;transition:background .2s,color .2s}
.lk:hover{background:var(--raise);color:var(--text)}
.lk .ic{width:14px;height:14px}
.mk{opacity:0;transition:opacity .2s}tr:hover .mk,.mk:focus-visible{opacity:1}
.intro tbody tr{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i)*35ms + 150ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.swap{animation:fade .22s ease}
@keyframes fade{from{opacity:.25}}
.sk td div{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--raise) 25%,#1E2D55 50%,var(--raise) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:64px 0;text-align:center;color:var(--mut)}
.empty svg{width:40px;height:40px;margin-bottom:12px;stroke-width:1.4}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
.pg{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 0 56px;color:var(--mut);font-size:13px}
.pg button{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s,opacity .2s}
.pg button:hover:not(:disabled){background:var(--raise)}.pg button:disabled{opacity:.35;cursor:default}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(3,6,15,.6);opacity:0;pointer-events:none;transition:opacity .35s;z-index:30}
.ov.on{opacity:1;pointer-events:auto}
aside{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);box-shadow:-1px 0 0 var(--line);transform:translateX(102%);transition:transform .5s var(--ease);z-index:31;display:flex;flex-direction:column}
aside.on{transform:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 24px 8px}
.dh h2{font-size:18px;font-weight:600;letter-spacing:-.01em}
.dh p{color:var(--mut);font-size:13px;margin-top:4px;max-width:300px}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--mut)}.x:hover{background:var(--raise);color:var(--text)}
#crit{flex:1;overflow:auto;padding:12px 24px}
.cr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);transition:opacity .25s}
.cr.off{opacity:.45}
.cr span{flex:1;font-size:13.5px}
.cr input[type=number]{width:60px;height:32px;border-radius:8px;border:0;background:var(--raise);text-align:center;outline:0}
.cr input[type=number]:focus{box-shadow:0 0 0 1.5px var(--blue2)}
.df{padding:18px 24px 24px;border-top:1px solid var(--line);display:grid;gap:14px}
.df .row{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mut);font-size:13px}
.df .row input[type=number]{width:64px;height:32px;border-radius:8px;border:0;background:var(--raise);text-align:center;outline:0}
.df .btn{justify-content:center;width:100%;height:40px}
#toasts{position:fixed;right:24px;bottom:24px;display:grid;gap:10px;z-index:40}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:11px;background:#fff;color:#0A1330;font-weight:550;box-shadow:0 14px 34px -10px rgba(0,0,0,.6);animation:tin .5s var(--ease)}
.toast .ic{color:var(--blue)}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media(max-width:760px){.wrap{padding:0 16px}.stats{grid-template-columns:1fr 1fr;row-gap:20px}.stat:nth-child(3){border:0;padding-left:0}.hd .pill,.hd .btn span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v11m0 0-4-4m4 4 4-4M5 19.5h14"/></symbol>
<symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7M8.5 7H17v8.5"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 8.5 7.5 5 7.5-5"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.2 3.6 8.5s-1.2 6.1-3.6 8.5c-2.4-2.4-3.6-5.2-3.6-8.5S9.6 5.9 12 3.5z"/></symbol>
<symbol id="i-l" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
<symbol id="i-r" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5"/></symbol>
<symbol id="i-sword" viewBox="0 0 24 24"><path d="M18 6 10 14M14 6h4v4M8.5 11.5l4 4M10.5 13.5l-4 4"/></symbol>
</svg>

<header>
  <div class="wrap hd">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#2F6BFF"/><g transform="translate(5 5)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 10 14M14 6h4v4M8.5 11.5l4 4M10.5 13.5l-4 4"/></g></svg>
      <div><b>SideQuest</b><span>Dead game scanner</span></div>
    </div>
    <div class="pill"><i class="dot" id="nd"></i><span id="nt">Discord alerts</span></div>
    <button class="btn ghost" id="bCrit"><svg class="ic"><use href="#i-sliders"/></svg><span>Criteria</span></button>
    <button class="btn ghost" id="bExp"><svg class="ic"><use href="#i-down"/></svg><span>Export Excel</span></button>
    <button class="btn pri" id="bScan"><svg class="ic"><use href="#i-play"/></svg><span>Scan Steam</span></button>
  </div>
  <div id="bar"><i></i></div>
</header>

<main class="wrap">
  <section class="stats" id="stats">
    <div class="stat hero"><strong data-k="dead">0</strong><span>Dead games</span></div>
    <div class="stat"><strong data-k="new_dead_24h">0</strong><span>Found in the last 24h</span></div>
    <div class="stat"><strong data-k="alive">0</strong><span>Still alive</span></div>
    <div class="stat"><strong data-k="total">0</strong><span>Games tracked</span></div>
  </section>
  <div class="scan" id="scan"><div><p id="scanTxt"></p></div></div>

  <div class="tb">
    <div class="seg" id="seg"><i class="thumb" id="thumb"></i>
      <button data-f="dead" class="on">Dead</button><button data-f="dying">Dying</button><button data-f="alive">Alive</button><button data-f="all">All</button>
    </div>
    <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Search a game" autocomplete="off"></label>
    <label class="sw"><input type="checkbox" id="cc"><i></i><em>Has contact</em></label>
    <span id="count"></span>
  </div>

  <div class="tbl intro" id="tbl">
    <table>
      <thead><tr><th>Game</th><th class="num">Players</th><th class="num">Reviews</th><th>Score</th><th>Contact</th><th>Status</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="pg"><span id="pgInfo"></span><button id="pp" aria-label="Previous page"><svg class="ic"><use href="#i-l"/></svg></button><button id="pn" aria-label="Next page"><svg class="ic"><use href="#i-r"/></svg></button></div>
</main>

<div class="ov" id="ov"></div>
<aside id="dr" aria-label="Score criteria">
  <div class="dh"><div><h2>Score criteria</h2><p>Switch criteria on or off. Scores are rescaled to 100 and the Excel export follows the same setup.</p></div><button class="x" id="dx" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div id="crit"></div>
  <div class="df">
    <div class="row"><span>Export only scores from</span><input type="number" id="eMin" min="0" max="100" value="0"></div>
    <button class="btn pri" id="bSave">Save and rescore</button>
  </div>
</aside>
<div id="toasts"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>n==null?'—':Number(n).toLocaleString('en');
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const J=(u,o)=>fetch(u,o).then(r=>r.json());
let filter='dead',page=1,PER=25,search='',first=true,scanning=false,timer;

function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=ic('ok')+`<span>${esc(msg)}</span>`;$('#toasts').append(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},2800)}
function countTo(el,to){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();(function f(t){const p=Math.min((t-t0)/800,1),e=1-Math.pow(1-p,3);el.textContent=nf(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(f)})(t0)}
function thumb(){const b=$('#seg .on');$('#thumb').style.cssText=`width:${b.offsetWidth}px;transform:translateX(${b.offsetLeft}px)`}

async function loadStats(){const s=await J('/api/stats');$$('#stats strong').forEach(e=>countTo(e,s[e.dataset.k]||0))}
async function loadGames(){
  const p=new URLSearchParams({page,per_page:PER,sort:'score'});
  if(filter!=='all')p.set('status',filter);if(search)p.set('search',search);if($('#cc').checked)p.set('has_contact','true');
  if(first)$('#tb').innerHTML=Array.from({length:8},()=>`<tr class="sk"><td><div style="width:60%"></div></td><td><div></div></td><td><div></div></td><td><div></div></td><td><div></div></td><td><div></div></td><td></td></tr>`).join('');
  const d=await J('/api/games?'+p);render(d.games);
  $('#count').textContent=nf(d.total)+' games';
  const pages=Math.max(1,Math.ceil(d.total/PER));$('#pgInfo').textContent=`Page ${page} of ${pages}`;$('#pp').disabled=page<=1;$('#pn').disabled=page>=pages;
}
function ring(s){const c=94.25,col=s>=60?'var(--blue2)':s>=30?'var(--blue)':'var(--mut)';
  return `<svg class="ring" viewBox="0 0 40 40"><circle class="rt" cx="20" cy="20" r="15"/><circle class="rv" cx="20" cy="20" r="15" stroke="${col}" stroke-dasharray="${c}" style="stroke-dashoffset:${c}" data-o="${c*(1-s/100)}" transform="rotate(-90 20 20)"/><text x="20" y="24.2">${s}</text></svg>`}
function render(games){
  const tb=$('#tb');
  if(!games.length){tb.innerHTML=`<tr><td colspan="7"><div class="empty"><svg class="ic"><use href="#i-sword"/></svg><b>No games here yet</b>Run a scan, or loosen the filters above.</div></td></tr>`;return}
  tb.innerHTML=games.map((g,i)=>{
    const icon=g.icon?`<img class="gi" src="https://cdn.discordapp.com/app-icons/${g.discord_id}/${g.icon}.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'gi',textContent:'${esc((g.name||'?')[0]).replace(/'/g,'')}'}))">`:`<div class="gi">${esc((g.name||'?')[0])}</div>`;
    const c=g.contact||'',cl=!c?'<span class="zero">—</span>':c.includes('@')?`<a class="ci" href="mailto:${esc(c)}" title="${esc(c)}">${ic('mail')}</a>`:`<a class="ci" href="${esc(c)}" target="_blank" rel="noopener" title="${esc(c)}">${ic('globe')}</a>`;
    return `<tr style="--i:${i}"><td><div class="game">${icon}<div style="min-width:0"><div class="gn">${esc(g.name)}</div><div class="gs">${esc(g.developers||'Unknown developer')}</div></div></div></td>
    <td class="num ${g.current_players?'':'zero'}">${nf(g.current_players)}</td><td class="num ${g.total_reviews?'':'zero'}">${nf(g.total_reviews)}</td>
    <td>${ring(g.score||0)}</td><td>${cl}</td><td><span class="bd ${g.status}">${g.status[0].toUpperCase()+g.status.slice(1)}</span></td>
    <td><div class="act">${g.status!=='dead'?`<button class="lk mk" data-dead="${g.discord_id}">Mark dead</button>`:''}${g.steam_appid?`<a class="lk" href="https://store.steampowered.com/app/${g.steam_appid}" target="_blank" rel="noopener">Steam ${ic('out')}</a>`:''}<a class="lk" href="https://discord.com/developers/applications/${g.discord_id}" target="_blank" rel="noopener">Claim ${ic('out')}</a></div></td></tr>`}).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.rv').forEach(e=>e.style.strokeDashoffset=e.dataset.o)));
  const t=$('#tbl');if(first){first=false;setTimeout(()=>t.classList.remove('intro'),1400)}else{t.classList.remove('swap');void t.offsetWidth;t.classList.add('swap')}
}

// scan state
function setScan(s){
  scanning=!!s.is_running;const b=$('#bScan');
  b.className='btn '+(scanning?'stop':'pri');b.innerHTML=`${ic(scanning?'stop':'play')}<span>${scanning?'Stop scan':'Scan Steam'}</span>`;
  $('#bar').classList.toggle('run',scanning);$('#bar i').style.width=(scanning?s.pct||0:0)+'%';
  $('#scan').classList.toggle('on',scanning);
  if(scanning)$('#scanTxt').innerHTML=`Scanning <b>${esc(s.current_game||'Steam library')}</b> — ${nf(s.progress)} of ${nf(s.total)} checked, ${nf(s.dead_count)} dead found`;
}
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.type==='scan_status'||m.type==='scan_progress')setScan(m);
    if(m.type==='scan_started')setScan({is_running:true,pct:0});
    if(m.type==='scan_complete'){setScan({is_running:false});toast(m.status==='stopped'?'Scan stopped':`Scan complete: ${m.new_dead} new dead games`);loadStats();loadGames()}
    if(m.type==='scan_error')toast('Scan failed: '+m.error);
    if(m.type==='game_updated'){loadStats();loadGames()}};
  ws.onclose=()=>setTimeout(connect,2000);
}

// criteria drawer
const drawer=on=>{$('#dr').classList.toggle('on',on);$('#ov').classList.toggle('on',on)};
async function loadCrit(){const c=await J('/api/criteria');
  $('#crit').innerHTML=Object.entries(c).map(([k,v])=>`<div class="cr ${v.enabled?'':'off'}"><label class="sw"><input type="checkbox" data-k="${k}" ${v.enabled?'checked':''}><i></i></label><span>${esc(v.label)}</span><input type="number" min="0" max="100" data-p="${k}" value="${v.points}" ${v.enabled?'':'disabled'} aria-label="Points"></div>`).join('')}
$('#crit').addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;const r=e.target.closest('.cr');r.classList.toggle('off',!e.target.checked);r.querySelector('[data-p]').disabled=!e.target.checked});
$('#bSave').onclick=async()=>{const body={};$$('#crit [data-k]').forEach(el=>body[el.dataset.k]={enabled:el.checked,points:+$(`[data-p="${el.dataset.k}"]`).value});
  const r=await J('/api/criteria',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  drawer(false);toast(`Scores updated for ${nf(r.recomputed)} games`);loadGames()};
$('#bCrit').onclick=()=>drawer(true);$('#dx').onclick=$('#ov').onclick=()=>drawer(false);
addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false);if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});

// actions
$('#bScan').onclick=()=>fetch(scanning?'/api/scan/stop':'/api/scan/start',{method:'POST'});
$('#bExp').onclick=()=>{const p=new URLSearchParams({status:(filter==='dead'||filter==='dying')?filter:'dead,dying',min_score:$('#eMin').value||0,has_contact:$('#cc').checked});location.href='/api/export.xlsx?'+p;toast('Your Excel file is downloading')};
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));filter=b.dataset.f;page=1;thumb();loadGames()};
$('#q').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{search=e.target.value.trim();page=1;loadGames()},250)};
$('#cc').onchange=()=>{page=1;loadGames()};
$('#pp').onclick=()=>{page--;loadGames()};$('#pn').onclick=()=>{page++;loadGames()};
$('#tb').onclick=async e=>{const b=e.target.closest('[data-dead]');if(!b)return;
  await fetch(`/api/games/${b.dataset.dead}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'dead'})});toast('Marked as dead')};

addEventListener('load',()=>{thumb();loadStats();loadGames();loadCrit();connect();
  J('/api/notifier/status').then(n=>{$('#nd').classList.toggle('on',n.connected);$('#nt').textContent=n.connected?'Discord alerts on':'Discord alerts off'}).catch(()=>{})});
addEventListener('resize',thumb);
</script>
</body>
</html>
